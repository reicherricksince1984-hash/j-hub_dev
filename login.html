<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | J-Hub - JLPT学習の、新しい標準。</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: ポップで親しみやすい丸ゴシック＆ラウンド系英字フォント -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800;900&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'M PLUS Rounded 1c', 'Zen Maru Gothic', sans-serif;
            letter-spacing: 0.02em;
        }
        .font-pop-title {
            font-family: 'Fredoka', 'Zen Maru Gothic', 'M PLUS Rounded 1c', sans-serif;
        }
        /* まるみのあるポップなカード装飾 */
        .pop-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid #e2e8f0;
            box-shadow: 0 20px 40px rgba(0, 102, 255, 0.08);
        }

        /* --------------------------------------------------
         * スクロールアニメーション（ふわっと表示）設定
         * -------------------------------------------------- */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 各要素を順番に時間差で表示するための遅延設定 */
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }
        .delay-400 { transition-delay: 400ms; }
        .delay-500 { transition-delay: 500ms; }
        .delay-600 { transition-delay: 600ms; }
    </style>
</head>
<body class="bg-[#f0f7ff] text-[#1e293b] antialiased min-h-screen flex flex-col justify-between selection:bg-[#a29bfe] selection:text-white">

    <!-- 1. 簡易ヘッダー -->
    <header class="w-full bg-[#f0f7ff]/90 backdrop-blur-md z-50 border-b-2 border-[#e2e8f0]">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between text-sm font-bold">
            <!-- カラフル・マルチカラーテキストロゴ -->
            <a href="index.html" class="font-pop-title text-2xl font-black tracking-wide hover:scale-105 transition-transform duration-300 inline-flex items-center space-x-[1px] group">
                <span class="text-[#0066ff] inline-block transition-transform group-hover:-translate-y-0.5">J</span>
                <span class="text-[#ffb703] inline-block transition-transform group-hover:-translate-y-0.5 delay-75">-</span>
                <span class="text-[#ff4757] inline-block transition-transform group-hover:-translate-y-0.5 delay-100">H</span>
                <span class="text-[#00b894] inline-block transition-transform group-hover:-translate-y-0.5 delay-150">u</span>
                <span class="text-[#a29bfe] inline-block transition-transform group-hover:-translate-y-0.5 delay-200">b</span>
                <span class="text-[#ff7675] inline-block transition-transform group-hover:rotate-12 group-hover:scale-125 delay-300 ml-[1px]">!</span>
            </a>
            <a href="index.html" class="text-xs sm:text-sm font-bold text-[#64748b] hover:text-[#0066ff] transition inline-flex items-center">
                ← トップページへ戻る
            </a>
        </div>
    </header>

    <!-- 2. メインコンテンツ（ログインフォーム） -->
    <main class="flex-grow flex items-center justify-center py-12 px-6">
        <div class="w-full max-w-md">
            
            <!-- カード容器 -->
            <div class="reveal pop-card rounded-3xl p-8 sm:p-10">
                
                <!-- タイトルエリア -->
                <div class="text-center mb-8 reveal delay-100">
                    <span class="inline-block text-xs font-extrabold tracking-wider text-[#0066ff] bg-[#e0f2fe] px-3.5 py-1 rounded-full mb-3 shadow-sm border border-[#0066ff]/20">
                        WELCOME BACK! 👋
                    </span>
                    <!-- ロゴスタイルの「J-Hub!」を含んだ見出し -->
                    <h1 class="font-pop-title text-2xl sm:text-3xl font-black text-[#1e293b] flex items-center justify-center space-x-1">
                        <span class="inline-flex items-center space-x-[1px]">
                            <span class="text-[#0066ff]">J</span>
                            <span class="text-[#ffb703]">-</span>
                            <span class="text-[#ff4757]">H</span>
                            <span class="text-[#00b894]">u</span>
                            <span class="text-[#a29bfe]">b</span>
                            <span class="text-[#ff7675] ml-[1px]">!</span>
                        </span>
                        <span>にログイン</span>
                    </h1>
                    <p class="text-xs text-[#64748b] font-medium mt-2">
                        ユーザーIDとパスワードを入力してください
                    </p>
                </div>

                <!-- フォーム -->
                <form action="#" method="POST" class="space-y-5">
                    
                    <!-- ユーザーID -->
                    <div class="reveal delay-200">
                        <label for="userid" class="block text-xs font-bold text-[#475569] mb-1.5 ml-1">
                            ユーザーID (UserID)
                        </label>
                        <div class="relative">
                            <input type="text" id="userid" name="userid" required placeholder="例: jhub_user123"
                                class="w-full bg-[#f8fafc] border-2 border-[#e2e8f0] focus:border-[#0066ff] focus:bg-white focus:outline-none rounded-2xl px-4 py-3 text-sm font-bold text-[#1e293b] placeholder-[#94a3b8] transition-all">
                        </div>
                    </div>

                    <!-- パスワード -->
                    <div class="reveal delay-300">
                        <label for="password" class="block text-xs font-bold text-[#475569] mb-1.5 ml-1">
                            パスワード (Password)
                        </label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required placeholder="••••••••"
                                class="w-full bg-[#f8fafc] border-2 border-[#e2e8f0] focus:border-[#0066ff] focus:bg-white focus:outline-none rounded-2xl pl-4 pr-11 py-3 text-sm font-bold text-[#1e293b] placeholder-[#94a3b8] transition-all">
                            <!-- パスワード表示切替ボタン -->
                            <button type="button" id="togglePassword" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#94a3b8] hover:text-[#0066ff] transition">
                                👁️
                            </button>
                        </div>
                        <!-- ログインボタンの直上に配置された「パスワードをお忘れですか？」リンク -->
                        <div class="text-right mt-2 mr-1">
                            <a href="#" class="text-xs font-bold text-[#0066ff] hover:underline">
                                パスワード(Password)をお忘れですか？
                            </a>
                        </div>
                    </div>

                    <!-- ログインボタン -->
                    <div class="reveal delay-400">
                        <button type="submit" class="w-full bg-[#0066ff] text-white font-bold text-base py-3.5 rounded-full hover:bg-[#0052cc] hover:shadow-lg transition shadow-md active:scale-95 pt-3.5 mt-2">
                            ログインする 🚀
                        </button>
                    </div>
                </form>

                <!-- 区切り線 -->
                <div class="my-8 border-t-2 border-[#e2e8f0] reveal delay-500"></div>

                <!-- 会員登録への案内エリア -->
                <div class="text-center reveal delay-600">
                    <p class="text-xs font-bold text-[#64748b] mb-3">
                        アカウントをお持ちでないですか？
                    </p>
                    <a href="create_account.html" class="inline-block w-full bg-[#e0f2fe] text-[#0066ff] font-bold py-3 rounded-full text-xs hover:bg-[#0066ff] hover:text-white transition shadow-sm active:scale-95">
                        会員登録 ✨
                    </a>
                </div>

            </div>

        </div>
    </main>

    <!-- 3. フッター -->
    <footer class="bg-[#f0f7ff] text-[#64748b] py-6 border-t-2 border-[#e2e8f0] text-xs font-bold">
        <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="font-pop-title text-base font-black tracking-wide inline-flex items-center space-x-[1px]">
                <span class="text-[#0066ff]">J</span>
                <span class="text-[#ffb703]">-</span>
                <span class="text-[#ff4757]">H</span>
                <span class="text-[#00b894]">u</span>
                <span class="text-[#a29bfe]">b</span>
                <span class="text-[#ff7675] ml-[1px]">!</span>
            </div>
            <<div class="flex space-x-4 text-[11px]">
                <a href="terms_of_service.html" class="hover:text-[#0066ff] transition">利用規約</a>
                <a href="privacy_policy.html" class="hover:text-[#0066ff] transition">プライバシーポリシー</a>
                <a href="contact.html" class="text-[#0066ff] transition">お問い合わせ</a>
            </div>
            <div class="text-[11px]">&copy; 2026 J-Hub Inc. All rights reserved.</div>
        </div>
    </footer>

    <!-- スクリプト -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ふわっと表示アニメーション
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
            }, 50);

            // パスワードの表示・非表示切り替え
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                togglePasswordBtn.textContent = isPassword ? '🔒' : '👁️';
            });
        });
    </script>
</body>
</html>
